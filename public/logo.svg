<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D5EF0" />
      <stop offset="1" stop-color="#4433C4" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#logo-bg)" />

  <!-- calendar binder rings -->
  <rect x="21" y="10" width="5" height="10" rx="2.5" fill="#FFFFFF" fill-opacity="0.92" />
  <rect x="38" y="10" width="5" height="10" rx="2.5" fill="#FFFFFF" fill-opacity="0.92" />

  <!-- calendar body -->
  <rect x="14" y="16" width="36" height="34" rx="6" fill="#FFFFFF" />
  <rect x="14" y="16" width="36" height="10" rx="6" fill="#FFFFFF" fill-opacity="0.55" />

  <!-- week grid dots -->
  <circle cx="21" cy="34" r="2.4" fill="#4433C4" fill-opacity="0.35" />
  <circle cx="29" cy="34" r="2.4" fill="#4433C4" fill-opacity="0.35" />
  <circle cx="21" cy="42" r="2.4" fill="#4433C4" fill-opacity="0.35" />

  <!-- success check badge -->
  <circle cx="40" cy="39" r="12.5" fill="#22C55E" stroke="#FFFFFF" stroke-width="2.5" />
  <path
    d="M34.5 39.2L38.2 43L46 34.8"
    stroke="#FFFFFF"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
